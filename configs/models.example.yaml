models:
  # 示例配置：请复制为 models.yaml，并填写实际路径

  qwen_summary_lora:
    backend: transformers
    base_model: /PATH/TO/Qwen2.5-3B-Instruct
    adapter_path: /PATH/TO/SUMMARY_LORA
    trust_remote_code: false
    device_map: auto
    tasks: [text_summarization]

  qwen_math_lora:
    backend: transformers
    base_model: /PATH/TO/MATH_BASE_MODEL
    adapter_path: /PATH/TO/MATH_LORA
    trust_remote_code: false
    device_map: auto
    tasks: [math_reasoning]

  qwen_medical_lora:
    backend: transformers
    base_model: /PATH/TO/MEDICAL_BASE_MODEL
    adapter_path: /PATH/TO/MEDICAL_LORA
    trust_remote_code: false
    device_map: auto
    tasks: [medical_qa]

  # vLLM 示例：api_base、服务名称需与实际服务一致
  qwen_base_vllm:
    backend: vllm
    api_base: http://127.0.0.1:8000/v1
    api_key: EMPTY
    served_model_name: qwen-base
    tasks: [medical_qa, math_reasoning, text_summarization]
