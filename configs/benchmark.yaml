benchmark:
  name: group-llm-benchmark
  version: 0.1.0
tasks:
  text_summarization:
    enabled: true
    dataset_path: data/text_summarization/lcsts_test_v1.jsonl
    dataset_version: lcsts-test-v1
    evaluator: summarization
  ancient_translation:
    enabled: true
    dataset_path: data/ancient_translation/test_v1.jsonl
    dataset_version: ancient-translation-v1
    evaluator: ancient_translation
  math_reasoning:
    enabled: true
    dataset_path: data/math_reasoning/mgsm_zh_test_v1.jsonl
    dataset_version: mgsm-zh-test-v1
    evaluator: math
  medical_qa:
    enabled: false
    dataset_path: data/medical_qa/test.jsonl
    dataset_version: pending
    evaluator: medical
  medical_mcq_xmedbench_v1:
    enabled: true
    dataset_path: data/medical_qa/xmedbench_zh_v1.jsonl
    dataset_version: xmedbench-zh-v1
    evaluator: medical_mcq_v1
inference:
  temperature: 0.0
  max_new_tokens: 256
  seed: 42
output:
  root_dir: outputs/runs
  save_predictions: true
  save_metrics: true
  save_run_metadata: true
comparison:
  record_base_model_id: true
  record_finetuned_model_id: true
  record_dataset_version: true
  record_inference_config: true
